
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Actividad 7 de Programación y Diseño Web II: autenticación con Google y Firebase.">
  <title>Bienvenido | Cinthia Marketing</title>
  <style>
    :root {
      color-scheme: light;
      --fondo: #f3f6fb;
      --superficie: #ffffff;
      --texto: #172033;
      --texto-suave: #5b6475;
      --primario: #3157c8;
      --primario-hover: #2445a8;
      --borde: #dce3ef;
      --exito-fondo: #eaf8ef;
      --exito-texto: #17633a;
      --error-fondo: #fff0f0;
      --error-texto: #a52222;
      --sombra: 0 18px 50px rgba(28, 44, 80, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(49, 87, 200, 0.10), transparent 32rem),
        var(--fondo);
      color: var(--texto);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    .contenedor { width: 100%; max-width: 480px; }

    .tarjeta {
      padding: clamp(24px, 6vw, 42px);
      background: var(--superficie);
      border: 1px solid var(--borde);
      border-radius: 24px;
      box-shadow: var(--sombra);
      text-align: center;
    }

    .marca {
      display: inline-grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin-bottom: 18px;
      border-radius: 18px;
      background: #e9efff;
      color: var(--primario);
      font-size: 1.65rem;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 5vw, 2rem);
      line-height: 1.2;
    }

    .descripcion {
      margin: 0 auto 26px;
      max-width: 34ch;
      color: var(--texto-suave);
    }

    .boton {
      width: 100%;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--primario);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .15s ease, transform .15s ease;
    }

    .boton:hover:not(:disabled) {
      background: var(--primario-hover);
    }

    .boton:active:not(:disabled) {
      transform: translateY(1px);
    }

    .boton:focus-visible {
      outline: 3px solid #91aaff;
      outline-offset: 3px;
    }

    .boton:disabled {
      cursor: wait;
      opacity: .65;
    }

    .boton-secundario {
      margin-top: 12px;
      background: #eef2f8;
      color: var(--texto);
    }

    .boton-secundario:hover:not(:disabled) {
      background: #e0e7f2;
    }

    .google-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
    }

    .panel {
      margin-top: 22px;
      padding: 16px;
      border-radius: 14px;
      text-align: left;
    }

    .panel p { margin: 0; }
    .panel p + p { margin-top: 8px; }

    .panel-bienvenida {
      background: var(--exito-fondo);
      color: var(--exito-texto);
    }

    .panel-info {
      background: #f2f5fb;
      color: var(--texto-suave);
    }

    .mensaje-error {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--error-fondo);
      color: var(--error-texto);
      text-align: left;
      overflow-wrap: anywhere;
    }

    .oculto { display: none !important; }

    .pie {
      margin: 18px 0 0;
      color: var(--texto-suave);
      font-size: .85rem;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="contenedor">
    <section class="tarjeta" aria-labelledby="titulo">
      <div class="marca" aria-hidden="true">CM</div>

      <h1 id="titulo">Bienvenido a Cinthia Marketing</h1>

      <p class="descripcion">
        Iniciá sesión con tu cuenta de Google para acceder a la página.
      </p>

      <div id="estado-visitante">
        <button id="btn-google" class="boton" type="button">
          <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" transform="translate(0 4)"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.73 7.18l7.65 5.94c4.47-4.13 7.12-10.2 7.12-17.59z"/>
            <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.53 2.56 10.78l7.97-6.19z" transform="translate(0 4)"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.81l-7.65-5.94c-2.13 1.43-4.86 2.27-8.25 2.27-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" transform="translate(0 -4)"/>
          </svg>
          <span>Iniciar sesión con Google</span>
        </button>

        <div class="panel panel-info">
          <p><strong>¡Hola!</strong> Todavía no iniciaste sesión.</p>
          <p>Usá el botón para ingresar de forma segura con Google.</p>
        </div>
      </div>

      <div id="estado-autenticado" class="oculto" aria-live="polite">
        <div class="panel panel-bienvenida">
          <p><strong>¡Bienvenido/a!</strong></p>
          <p id="nombre-usuario">Tu sesión está iniciada.</p>
          <p id="correo-usuario"></p>
        </div>

        <button id="btn-salir" class="boton boton-secundario" type="button">
          Cerrar sesión
        </button>
      </div>

      <p id="mensaje-error" class="mensaje-error oculto" role="alert"></p>
      <p id="estado-carga" class="pie" role="status" aria-live="polite"></p>
    </section>

    <p class="pie">Actividad 7 · Programación y Diseño Web II</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    // Configuración real del proyecto Firebase.
    const firebaseConfig = {
      apiKey: "AIzaSyCSyGzlknfpYXz8rv6pM2daNuzZa5SeGUY",
      authDomain: "bienvenido-a-cinthia-marketing.firebaseapp.com",
      projectId: "bienvenido-a-cinthia-marketing",
      storageBucket: "bienvenido-a-cinthia-marketing.firebasestorage.app",
      messagingSenderId: "158646150955",
      appId: "1:158646150955:web:b6406929ac0bd18eec876e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const proveedorGoogle = new GoogleAuthProvider();

    const estadoVisitante = document.getElementById("estado-visitante");
    const estadoAutenticado = document.getElementById("estado-autenticado");
    const btnGoogle = document.getElementById("btn-google");
    const btnSalir = document.getElementById("btn-salir");
    const nombreUsuario = document.getElementById("nombre-usuario");
    const correoUsuario = document.getElementById("correo-usuario");
    const mensajeError = document.getElementById("mensaje-error");
    const estadoCarga = document.getElementById("estado-carga");

    function mostrarError(mensaje) {
      mensajeError.textContent = mensaje;
      mensajeError.classList.remove("oculto");
    }

    function limpiarError() {
      mensajeError.textContent = "";
      mensajeError.classList.add("oculto");
    }

    function traducirError(error) {
      switch (error?.code) {
        case "auth/popup-closed-by-user":
          return "Se cerró la ventana de Google antes de completar el inicio de sesión.";

        case "auth/popup-blocked":
          return "El navegador bloqueó la ventana emergente. Permití las ventanas emergentes e intentá nuevamente.";

        case "auth/unauthorized-domain":
          return "Este dominio no está autorizado en Firebase. Agregalo en Authentication → Settings → Authorized domains.";

        case "auth/operation-not-allowed":
          return "El acceso con Google no está habilitado. Activá el proveedor Google en Firebase Authentication.";

        case "auth/network-request-failed":
          return "No se pudo conectar con Firebase. Revisá tu conexión a internet e intentá otra vez.";

        case "auth/cancelled-popup-request":
          return "Ya hay una ventana de inicio de sesión abierta. Completala o cerrala antes de volver a intentar.";

        default:
          return `Ocurrió un error${error?.code ? ` (${error.code})` : ""}. Revisá la configuración de Firebase e intentá nuevamente.`;
      }
    }

    // Iniciar sesión con Google.
    btnGoogle.addEventListener("click", async () => {
      limpiarError();
      btnGoogle.disabled = true;
      estadoCarga.textContent = "Conectando con Google…";

      try {
        await signInWithPopup(auth, proveedorGoogle);
      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        mostrarError(traducirError(error));
      } finally {
        btnGoogle.disabled = false;
        estadoCarga.textContent = "";
      }
    });

    // Cerrar la sesión actual.
    btnSalir.addEventListener("click", async () => {
      limpiarError();
      btnSalir.disabled = true;
      estadoCarga.textContent = "Cerrando sesión…";

      try {
        await signOut(auth);
      } catch (error) {
        console.error("Error al cerrar sesión:", error);
        mostrarError(traducirError(error));
      } finally {
        btnSalir.disabled = false;
        estadoCarga.textContent = "";
      }
    });

    // Detectar si hay un usuario autenticado.
    onAuthStateChanged(
      auth,
      (usuario) => {
        limpiarError();

        if (usuario) {
          estadoVisitante.classList.add("oculto");
          estadoAutenticado.classList.remove("oculto");

          nombreUsuario.textContent =
            usuario.displayName || "Tu cuenta de Google";

          correoUsuario.textContent = usuario.email || "";
        } else {
          estadoAutenticado.classList.add("oculto");
          estadoVisitante.classList.remove("oculto");

          nombreUsuario.textContent = "";
          correoUsuario.textContent = "";
        }
      },
      (error) => {
        console.error("Error al comprobar la autenticación:", error);

        mostrarError(
          "No se pudo comprobar el estado de la sesión. Recargá la página e intentá nuevamente."
        );
      }
    );
  </script>
</body>
</html>
